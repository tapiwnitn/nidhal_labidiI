<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nidhal Labidi</title>
  <meta name="description" content="Nidhal Labidi : Instagram, TikTok et contact.">
  <meta property="og:title" content="Nidhal Labidi">
  <meta property="og:description" content="Instagram, TikTok et contact.">
  <meta property="og:image" content="logo.png">
  <meta name="theme-color" content="#071232">
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --nuit: #050f28;
      --marine: #0b1f4d;
      --marine-clair: #14306e;
      --or: #d9b794;
      --or-clair: #efdcc3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: var(--nuit); }
    body { min-height: 100vh; }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: var(--or-clair);
      background: linear-gradient(180deg, var(--marine) 0%, #081736 45%, var(--nuit) 100%);
      position: relative;
      overflow-x: hidden;
    }

    .vagues {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(40px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }

    .logo {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(217,183,148,.12), 0 12px 32px rgba(0,0,0,.45);
    }

    h1 {
      margin-top: 26px;
      font-family: "Times New Roman", Georgia, serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--or-clair);
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 20px 0 30px;
    }
    .icons a { color: var(--or); display: block; width: 26px; height: 26px; transition: transform .15s, color .15s; }
    .icons a:hover { color: var(--or-clair); transform: translateY(-2px); }
    .icons a:focus-visible { outline: 2px solid var(--or); outline-offset: 4px; border-radius: 4px; }
    .icons svg { width: 100%; height: 100%; display: block; }

    /* ===== Vidéos ===== */
    .section-titre {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 14px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--or);
      margin-bottom: 12px;
    }

    .videos {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 14px;
      margin: 0 -20px 18px;
      padding-left: 20px;
      padding-right: 20px;
      scrollbar-width: none;
    }
    .videos::-webkit-scrollbar { display: none; }

    .video-slot,
    .photo-slot {
      flex: 0 0 auto;
      width: 190px;
      aspect-ratio: 9 / 16;
      scroll-snap-align: center;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(20,48,110,.7), rgba(5,15,40,.9));
      border: 1px solid rgba(217,183,148,.45);
      box-shadow: 0 10px 24px rgba(0,0,0,.4);
      position: relative;
      display: grid;
      place-items: center;
    }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-slot video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

    /* Emplacement vide */
    .video-slot .vide { display: grid; gap: 10px; justify-items: center; padding: 16px; color: var(--or); font-size: 13px; letter-spacing: .06em; }
    .video-slot .play {
      width: 54px; height: 54px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1.5px solid var(--or);
      background: rgba(217,183,148,.1);
    }
    .video-slot .play svg { width: 22px; height: 22px; margin-left: 3px; fill: var(--or); }


    /* ===== Boutons ===== */
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--or-clair);
      text-decoration: none;
      padding: 17px 20px;
      margin-bottom: 14px;
      border-radius: 12px;
      border: 1px solid rgba(217,183,148,.5);
      background: linear-gradient(180deg, rgba(20,48,110,.55), rgba(7,18,50,.75));
      font-size: 16px;
      letter-spacing: .08em;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform .15s, border-color .15s, background .15s;
    }
    .btn:hover { transform: translateY(-2px); border-color: var(--or); background: linear-gradient(180deg, rgba(31,66,140,.65), rgba(7,18,50,.8)); }
    .btn:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }
    .btn .ico { width: 24px; height: 24px; color: var(--or); flex-shrink: 0; }
    .btn .ico svg { width: 100%; height: 100%; display: block; }
    .btn .txt { flex: 1; text-align: center; margin-right: 24px; }

    .footer {
      margin-top: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .12em;
      color: var(--or);
      opacity: .85;
    }
    .footer .point { width: 7px; height: 7px; background: var(--or); transform: rotate(45deg); }

    @media (prefers-reduced-motion: reduce) { .btn, .icons a { transition: none; } .videos { scroll-behavior: auto; } }
  </style>
</head>
<body>

  <!-- Vagues dorées décoratives -->
  <svg class="vagues" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="M400 190 C 330 260, 200 330, 0 360 L0 470 C 190 440, 330 380, 400 300 Z" fill="rgba(217,183,148,.16)"/>
    <path d="M0 470 C 120 520, 260 560, 400 520 L400 640 C 250 690, 100 650, 0 590 Z" fill="rgba(217,183,148,.12)"/>
    <path d="M0 610 C 110 690, 230 740, 400 700 L400 800 L0 800 Z" fill="rgba(217,183,148,.07)"/>
  </svg>

  <!-- Icônes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-instagram" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/>
    </symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    </symbol>
  </svg>

  <main class="container">

    <img src="logo.jpg" alt="Logo Nidhal Labidi" class="logo">
    <h1>Nidhal Labidi</h1>

    <nav class="icons" aria-label="Contact rapide">
      <a href="https://www.instagram.com/VOTRE_INSTAGRAM/" aria-label="Instagram"><svg><use href="#i-instagram"/></svg></a>
      <a href="https://www.tiktok.com/@VOTRE_TIKTOK" aria-label="TikTok"><svg><use href="#i-tiktok"/></svg></a>
      <a href="tel:+21626203292" aria-label="Appeler"><svg><use href="#i-phone"/></svg></a>
    </nav>

    <!-- ===== VIDÉOS =====
         Mets tes fichiers vidéo (mp4) dans le même dossier que ce fichier,
         puis écris leur nom dans data-mp4. Laisse vide pour garder l'emplacement « Votre vidéo ici ».
         Pour ajouter une vidéo : copie/colle une ligne <div class="video-slot" ...></div>.
         Le bloc du milieu est une PHOTO (class="photo-slot") : change le nom du fichier dans src. -->
    <h2 class="section-titre">Vidéos</h2>
    <div class="videos" id="videos">
      <div class="video-slot" data-mp4="vid.mp4"></div>
      <div class="photo-slot">
        <img src="ph.jpeg" alt="Carte NFC Tapiwni" loading="lazy">
      </div>
      <div class="video-slot" data-mp4="vd.mp4"></div>
    </div>

    <a class="btn" href="https://www.instagram.com/VOTRE_INSTAGRAM/">
      <span class="ico"><svg><use href="#i-instagram"/></svg></span>
      <span class="txt">Instagram</span>
    </a>

    <a class="btn" href="https://www.tiktok.com/@VOTRE_TIKTOK">
      <span class="ico"><svg><use href="#i-tiktok"/></svg></span>
      <span class="txt">TikTok</span>
    </a>

    <a class="btn" href="tel:+21626203292">
      <span class="ico"><svg><use href="#i-phone"/></svg></span>
      <span class="txt">+216 26203292</span>
    </a>

    <footer class="footer">
      <span class="point"></span>
      <span>Tapiwni</span>
    </footer>

  </main>

  <script>
    (function () {
      var placeholder =
        '<div class="vide">' +
          '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>' +
          '<span>Votre vidéo ici</span>' +
        '</div>';

      document.querySelectorAll('.video-slot').forEach(function (slot) {
        var mp4 = (slot.dataset.mp4 || '').trim();
        if (!mp4) { slot.innerHTML = placeholder; return; }

        var v = document.createElement('video');
        v.src = mp4 + '#t=0.1';
        v.controls = true;
        v.playsInline = true;
        v.preload = 'metadata';
        v.addEventListener('error', function () { slot.innerHTML = placeholder; });
        slot.appendChild(v);
      });
    })();
  </script>

</body>
</html>
